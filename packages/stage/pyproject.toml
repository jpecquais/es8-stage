[project]
name = "es8stage"
version = "0.1.0"
description = "ES Eight Stage: rigs and setlists compiled for the BOSS ES-8, ES8 Designer, ES8 Companion and a Raspberry Pi stage host."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["boss", "es-8", "midi", "setlist", "loop switcher", "raspberry pi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "es8core[midi]",
    "es8ctl",
    "typer>=0.12",
]

[project.scripts]
es8stage = "es8stage.cli:app"

[tool.uv.sources]
es8core = { workspace = true }
es8ctl = { workspace = true }

[project.urls]
Repository = "https://github.com/jpecquais/es8-stage"
Issues = "https://github.com/jpecquais/es8-stage/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/es8stage"]

# Les applis web sont embarquées pour que `es8stage serve` marche une fois installé.
[tool.hatch.build.targets.wheel.force-include]
"../../web" = "es8stage/web"
